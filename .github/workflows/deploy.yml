name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deploys by publishing dist/ to the gh-pages branch. GitHub enables Pages
# automatically for that branch, so no admin API access is required.
permissions:
  contents: write

# Deploys serialise on one group so two pushes never race the gh-pages branch.
# Pull-request checks get their own group per branch, so they neither queue behind a
# deploy nor block one, and a new push supersedes the run it replaces.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: i18n parity
        run: npm run i18n:check

      - name: Build
        run: npm run build
        env:
          # Stamped into dist/version.json so a deploy can be identified over the wire.
          SOODA_COMMIT: ${{ github.sha }}

      - name: Bundle budget
        run: npm run budget

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: 'deploy: ${{ github.event.head_commit.message || github.sha }}'
